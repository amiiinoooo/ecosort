#history.html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartBin History</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background-color: #212529;
            color: white;
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
            align-items: center;
        }

        .navbar .logo {
            font-weight: bold;
            font-size: 1.2em;
        }

        .navbar .nav-links a {
            color: white;
            margin-left: 20px;
            text-decoration: none;
        }

        h1 {
            text-align: center;
            margin-top: 30px;
        }

        .graph-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            margin: 30px;
        }

        .graph {
            width: 45%;
            min-width: 300px;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        h2 {
            text-align: center;
        }

        table {
            width: 90%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }

        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ccc;
        }

        th {
            background-color: #f3f3f3;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">SmartBin</div>
        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/history">History</a>
            <a href="/logout">Logout</a>
        </div>
    </div>

    <h1>SmartBin History</h1>

    <div class="graph-container">
        <div class="graph">
            <h2>Fill Level Over Time</h2>
            <canvas id="fillLevelChart"></canvas>
        </div>
        <div class="graph">
            <h2>Weight Over Time</h2>
            <canvas id="weightChart"></canvas>
        </div>
    </div>

    <h2>Log Table</h2>
    <table>
        <thead>
            <tr>
                <th>Bin</th>
                <th>Weight (kg)</th>
                <th>Logged At</th>
            </tr>
        </thead>
        <tbody>
            {% for row in logs %}
                <tr>
                    <td>{{ row.name }}</td>
                    <td>{{ row.weight }}</td>
                    <td>{{ row.logged_at }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>

    <script>
        const timestampsPlastic = {{ timestamps_plastic | default([]) | tojson }};
        const poidsPlastic = {{ poids_plastic | default([]) | tojson }};
        const fillLevelsPlastic = {{ fill_levels_plastic | default([]) | tojson }};
        
        const timestampsOrganic = {{ timestamps_organic | default([]) | tojson }};
        const poidsOrganic = {{ poids_organic | default([]) | tojson }};
        const fillLevelsOrganic = {{ fill_levels_organic | default([]) | tojson }};
        
        const timestampsMetal = {{ timestamps_metal | default([]) | tojson }};
        const poidsMetal = {{ poids_metal | default([]) | tojson }};
        const fillLevelsMetal = {{ fill_levels_metal | default([]) | tojson }};
        
        const timestampsPaper = {{ timestamps_paper | default([]) | tojson }};
        const poidsPaper = {{ poids_paper | default([]) | tojson }};
        const fillLevelsPaper = {{ fill_levels_paper | default([]) | tojson }};
        
        const colors = {
            plastic: 'rgba(30, 144, 255, 1)',
            organic: 'rgba(34, 139, 34, 1)',
            metal: 'rgba(255, 0, 0, 1)',
            paper: 'rgba(255, 165, 0, 1)'
        };

        const createChart = (canvasId, labels, data, chartType, label, colors) => {
            return new Chart(document.getElementById(canvasId), {
                type: chartType,
                data: {
                    labels: labels,
                    datasets: data.map((item, index) => ({
                        label: item.label,
                        data: item.values,
                        borderColor: colors[index],
                        backgroundColor: colors[index].replace('1)', '0.1)'),
                        fill: chartType === 'line',
                        borderWidth: 2
                    }))
                },
                options: {
                    responsive: true,
                    scales: {
                        x: { title: { display: true, text: 'Time' }, ticks: { maxRotation: 45, minRotation: 30 } },
                        y: {
                            title: { display: true, text: label },
                            min: 0,
                            max: label.includes('%') ? 100 : 5, // Set max to 5 for kg scale
                            ticks: {
                                stepSize: 1 // Optional: Set step size for the y-axis ticks
                            }
                        }
                    },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': ' + context.raw.toFixed(2);
                                }
                            }
                        }
                    }
                }
            });
        };

        const allTimestamps = {{ timestamps | default([]) | tojson }};

        function alignTimestamps(timestamps, values) {
            return allTimestamps.map(timestamp => {
                const index = timestamps.indexOf(timestamp);
                return index === -1 ? null : values[index];
            });
        }

        const alignedFillLevelsOrganic = alignTimestamps(timestampsOrganic, fillLevelsOrganic);
        const alignedFillLevelsMetal = alignTimestamps(timestampsMetal, fillLevelsMetal);
        const alignedFillLevelsPaper = alignTimestamps(timestampsPaper, fillLevelsPaper);

        const alignedPoidsOrganic = alignTimestamps(timestampsOrganic, poidsOrganic);
        const alignedPoidsMetal = alignTimestamps(timestampsMetal, poidsMetal);
        const alignedPoidsPaper = alignTimestamps(timestampsPaper, poidsPaper);

        createChart('fillLevelChart', allTimestamps, [
            { label: 'Organic', values: alignedFillLevelsOrganic },
            { label: 'Metal', values: alignedFillLevelsMetal },
            { label: 'Paper', values: alignedFillLevelsPaper }
        ], 'line', 'Fill Level (%)', [colors.organic, colors.metal, colors.paper]);

        createChart('weightChart', allTimestamps, [
            { label: 'Organic', values: alignedPoidsOrganic },
            { label: 'Metal', values: alignedPoidsMetal },
            { label: 'Paper', values: alignedPoidsPaper }
        ], 'line', 'Weight (kg)', [colors.organic, colors.metal, colors.paper]);
    </script>
</body>
</html>
